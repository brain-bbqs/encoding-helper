name: Version Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "configs/**"
      - "package.json"
      - "package-lock.json"

jobs:
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version bump
        run: |
          PR_VERSION=$(node -p "require('./package.json').version")
          if ! git cat-file -e origin/${{ github.base_ref }}:package.json 2>/dev/null; then
            echo "No package.json on origin/${{ github.base_ref }} yet (this PR introduces it) — nothing to compare against."
            echo "PR version: $PR_VERSION ✓"
            exit 0
          fi
          BASE_VERSION=$(git show origin/${{ github.base_ref }}:package.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).version))")
          echo "Base version: $BASE_VERSION"
          echo "PR version:   $PR_VERSION"
          if [ "$PR_VERSION" = "$BASE_VERSION" ]; then
            echo "::error::Version has not been bumped. Please update the version in package.json."
            exit 1
          fi
          echo "Version bumped from $BASE_VERSION to $PR_VERSION ✓"
