name: Chromatic (Storybook)

on: push

permissions:
  contents: read

jobs:
  chromatic:
    name: Run Chromatic (Storybook)
    # Dependabot-triggered runs cannot read Actions secrets, so the
    # Chromatic project token is unavailable; skip instead of failing.
    if: github.actor != 'dependabot[bot]'
    # Pinned rather than ubuntu-latest: a runner image bump (system fonts, antialiasing,
    # rasterizer) shifts screenshot pixels on its own, with no code change to explain it.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic
        uses: chromaui/action@v18.8.0
        env:
          CHROMATIC_STATIC_VERSION: "true"
        with:
          projectToken: ${{ secrets.CHROMATIC_STORYBOOK_PROJECT_TOKEN }}
          onlyChanged: true
