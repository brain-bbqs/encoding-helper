name: Chromatic (Storybook)

# Builds Storybook without the project token and hands it on as an artifact; `chromatic-publish.yml`
# uploads it to Chromatic from the default branch, which holds the token. Building without it is what
# lets a pull request from a fork get snapshots, since GitHub gives a fork's runs no secrets.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  chromatic:
    # Named for the required check it satisfies; Chromatic's own statuses on the commit report the
    # result of the upload.
    name: Run Chromatic (Storybook)
    # A branch of this repository is already built on push, so only a fork's pull request is built
    # as one.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # Not pinned, unlike chromatic-playwright.yml: this job only builds Storybook, and Chromatic
    # draws the stories in its own browsers, so the runner's fonts and rasterizer never reach a
    # snapshot.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The commit Chromatic reports on, rather than the merge commit a pull request would
          # otherwise check out.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The whole history, for the behind-main report below.
          fetch-depth: 0

      - name: Report how far the branch is behind main
        # Chromatic takes the branch's own last build as the baseline, so a branch that has not
        # seen main in a week diffs against a week-old UI and reports main's changes as this
        # branch's. Merge main in before reading the result.
        if: github.ref != 'refs/heads/main'
        run: |
          git fetch --no-tags --quiet origin main
          behind=$(git rev-list --count HEAD..origin/main)
          if [ "$behind" -eq 0 ]; then
            echo "Branch is up to date with main."
          else
            echo "::notice::This branch is $behind commit(s) behind main. Chromatic diffs it against the branch's own last build, so the changes it reports may be main's rather than this branch's; merge main in before reading them."
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook -- --output-dir storybook-static
        env:
          # Read by the app's Vite config (not by Chromatic): pins the footer's version string so a
          # version bump alone does not re-snapshot every story.
          CHROMATIC_STATIC_VERSION: "true"

      - name: Upload Storybook
        # The name `chromatic-publish.yml` downloads; kept a day, long enough for it to run.
        uses: actions/upload-artifact@v7
        with:
          name: chromatic-build
          path: storybook-static/
          retention-days: 1
