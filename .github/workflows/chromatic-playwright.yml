name: Chromatic (Playwright)

# Runs the snapshot tests and builds a Storybook from their archives without the project token, and
# hands it on as an artifact; `chromatic-publish.yml` uploads it to Chromatic from the default
# branch, which holds the token. Building without it is what lets a pull request from a fork get
# snapshots, since GitHub gives a fork's runs no secrets.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  chromatic-playwright:
    # Named for the required check it satisfies; Chromatic's own statuses on the commit report the
    # result of the upload.
    name: Run Chromatic (Playwright)
    # A branch of this repository is already built on push, so only a fork's pull request is built
    # as one.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # Pinned rather than ubuntu-latest: a runner image bump (system fonts, antialiasing,
    # rasterizer) shifts screenshot pixels on its own, with no code change to explain it.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The commit Chromatic reports on, rather than the merge commit a pull request would
          # otherwise check out.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The whole history, for the behind-main report below.
          fetch-depth: 0

      - name: Report the runner image
        # The ubuntu-24.04 label is not a fixed machine: the image behind it is rebuilt roughly
        # weekly, and a new one brings new fonts and rasterizer libraries, which move text pixels
        # on their own. Printed so a snapshot diff with no code change behind it can be checked
        # against the image its baseline was drawn on. The CPU is printed too: the label lands on
        # machines with and without AVX-512, which is what the fixture encode used to depend on.
        run: |
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          echo "CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs)"
          if grep -qw avx512f /proc/cpuinfo; then echo "AVX-512: yes"; else echo "AVX-512: no"; fi

      - name: Report how far the branch is behind main
        # Chromatic takes the branch's own last build as the baseline, so a branch that has not
        # seen main in a week diffs against a week-old UI and reports main's changes as this
        # branch's. Merge main in before reading the result.
        if: github.ref != 'refs/heads/main'
        run: |
          git fetch --no-tags --quiet origin main
          behind=$(git rev-list --count HEAD..origin/main)
          if [ "$behind" -eq 0 ]; then
            echo "Branch is up to date with main."
          else
            echo "::notice::This branch is $behind commit(s) behind main. Chromatic diffs it against the branch's own last build, so the changes it reports may be main's rather than this branch's; merge main in before reading them."
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        # Builds the video the tests load in place of the sample file this app used to
        # ship with; see tests/fixtures/demoVideo.ts. Version pinned (matching the
        # ubuntu-24.04 runner above): an apt-served point release re-encodes the fixture
        # to slightly different pixels, which show up as unrelated snapshot diffs since
        # that video appears directly in the app's canvas/thumbnail previews.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg=7:6.1.1-3ubuntu5

      - name: Install Playwright browsers
        # --with-deps installs system libraries and needs root, which the runner has and a
        # developer's machine does not; locally, `npx playwright install chromium` is enough.
        run: npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: npm run test:chromatic
        env:
          # Read by the app's Vite config (not by Chromatic) during the build that the Playwright
          # config's webServer command runs: pins the footer's version string so a version bump
          # alone does not re-snapshot the page.
          CHROMATIC_STATIC_VERSION: "true"

      - name: Report the fixture video's hash
        # The fixture is re-encoded on every run (tests/fixtures/demoVideo.ts) and its bytes reach
        # the snapshots, so an encode that came out different is a visual change with nothing in
        # the diff to explain it. Printed rather than asserted against a stored hash: the expected
        # value would have to be re-pinned for every ffmpeg version.
        if: always()
        run: sha256sum tests/fixtures/.generated/* || echo "No generated fixture to hash."

      - name: Build archive Storybook
        # Turns the archives under test-results/ into a Storybook. Called through its path rather
        # than `npm exec`, which would take `--output-dir` as one of its own options.
        run: ./node_modules/.bin/build-archive-storybook --output-dir=storybook-static

      - name: Upload archive Storybook
        # The name `chromatic-publish.yml` downloads; kept a day, long enough for it to run.
        uses: actions/upload-artifact@v7
        with:
          name: chromatic-build
          path: storybook-static/
          retention-days: 1
