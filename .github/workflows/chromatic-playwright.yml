name: Chromatic (Playwright)

on: push

permissions:
  contents: read

jobs:
  chromatic-playwright:
    name: Run Chromatic (Playwright)
    # Dependabot-triggered runs cannot read Actions secrets, so the
    # Chromatic project token is unavailable; skip instead of failing.
    if: github.actor != 'dependabot[bot]'
    # Pinned rather than ubuntu-latest: a runner image bump (system fonts, antialiasing,
    # rasterizer) shifts screenshot pixels on its own, with no code change to explain it.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        # Builds the video the tests load in place of the sample file this app used to
        # ship with; see tests/fixtures/demoVideo.ts. Version pinned (matching the
        # ubuntu-24.04 runner above): an apt-served point release re-encodes the fixture
        # to slightly different pixels, which show up as unrelated snapshot diffs since
        # that video appears directly in the app's canvas/thumbnail previews.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg=7:6.1.1-3ubuntu5

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:chromatic
        env:
          CHROMATIC_STATIC_VERSION: "true"

      - name: Run Chromatic
        uses: chromaui/action@v18.8.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PLAYWRIGHT_PROJECT_TOKEN }}
          playwright: true
