name: Upload demos to EMBER

# Generates the demo set (scripts/generate-demos.sh) and uploads it to EMBER
# dandiset 000527 with the dandi CLI (scripts/upload-demos.sh). Manual only:
# run it from the Actions tab when the demo set or its source video changes.
#
# Needs an `EMBER_DANDI_API_KEY` repository secret holding an API key for the
# EMBER archive (from the account menu at dandi.emberarchive.org); the account
# must have write access to the dandiset.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Generate demo files
        run: scripts/generate-demos.sh -o demo-out

      - name: Show manifest
        run: cat demo-out/sub-01/video/manifest.json

      - name: Keep the demo set as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: demos
          path: demo-out/
          retention-days: 14

      - name: Install the dandi CLI
        run: pipx install dandi

      - name: Upload to EMBER
        env:
          DANDI_API_KEY: ${{ secrets.EMBER_DANDI_API_KEY }}
        run: scripts/upload-demos.sh -o demo-out
