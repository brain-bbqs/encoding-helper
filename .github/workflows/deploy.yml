name: Deploy to Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: pages
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            # No build step: this app is a static index.html with no package.json.

            - name: Deploy to gh-pages branch
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: .
                  keep_files: true
