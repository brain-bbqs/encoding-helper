name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Playwright integration tests run separately from the Lint workflow so a
  # slow or flaky browser run never blocks the quality gates or coverage upload.
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Keep apt's downloads in a cacheable directory
        # Some runners get an apt mirror that serves packages at tens of kB/s; see the same step
        # in chromatic-playwright.yml for why the .deb files are kept between runs, and where.
        id: apt-cache
        run: |
          sudo install -d -o "$(id -un)" /var/cache/apt-ci
          sudo install -d -o _apt -m 700 /var/cache/apt-ci/partial
          printf '%s\n' \
            'Dir::Cache::Archives "/var/cache/apt-ci/";' \
            'APT::Keep-Downloaded-Packages "true";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' |
            sudo tee /etc/apt/apt.conf.d/99-ci-package-cache > /dev/null
          playwright=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          workflow=$(sha256sum .github/workflows/test.yml | cut -c1-12)
          echo "prefix=apt-test-${ImageOS}-" >> "$GITHUB_OUTPUT"
          echo "key=apt-test-${ImageOS}-${ImageVersion}-${workflow}-playwright-${playwright}" >> "$GITHUB_OUTPUT"

      - name: Restore apt's downloads
        uses: actions/cache@v6
        with:
          path: /var/cache/apt-ci/*.deb
          key: ${{ steps.apt-cache.outputs.key }}
          restore-keys: ${{ steps.apt-cache.outputs.prefix }}

      - name: Install ffmpeg
        # Builds the video the tests load in place of the sample file this app used to
        # ship with; see tests/fixtures/demoVideo.ts.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Integration tests
        run: npm run test:integration
